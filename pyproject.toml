[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orochi"
version = "0.1.0"
description = "Orochi: Versatile Biomedical Image Processor"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Gaole Dai", email = ""},
    {name = "Chenghao Zhou", email = ""},
    {name = "Yu Zhou", email = ""},
]
keywords = ["biomedical", "image-processing", "mamba", "deep-learning", "medical-imaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "torchaudio>=2.4.0",
    "mamba-ssm==2.2.2",
    "timm>=1.0.0",
    "transformers>=4.44.0",
    "opencv-python>=4.10.0",
    "scikit-image>=0.24.0",
    "monai>=1.4.0",
    "nibabel>=5.3.0",
    "simpleitk>=2.5.0",
    "tifffile>=2023.4.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "wandb>=0.18.0",
    "tensorboard>=2.17.0",
    "einops>=0.8.0",
    "causal-conv1d>=1.4.0",
    "h5py>=3.12.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "isort>=5.13.0",
    "pre-commit>=3.6.0",
]
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/jnjnnjzch/foundation-mamba-biomed"
Repository = "https://github.com/jnjnnjzch/foundation-mamba-biomed"
Documentation = "https://github.com/jnjnnjzch/foundation-mamba-biomed"
"Bug Tracker" = "https://github.com/jnjnnjzch/foundation-mamba-biomed/issues"

[project.scripts]
orochi-train = "orochi.cli.train:main"
orochi-eval = "orochi.cli.evaluate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orochi*"]
exclude = ["tests*", "temp*", "experiments*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.tox
  | build
  | dist
  | __pycache__
  | \.eggs
  | temp
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "mamba_ssm.*",
    "timm.*",
    "monai.*",
    "nibabel.*",
    "simpleitk.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=orochi",
    "--cov-report=html",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["orochi"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
